<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Help Hand MVP - Map & Tasks</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #4776E6;
            --primary-gradient: linear-gradient(135deg, #4776E6 0%, #8E54E9 100%);
            --success: #00b894;
            --danger: #ff7675;
            --bg: #F8F9FD;
            --card: #FFFFFF;
            --text-main: #2d3436;
            --text-sub: #636e72;
            --shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text-main); overflow-x: hidden; }

        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 80px; position: relative; }

        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo { font-weight: 800; font-size: 1.4rem; letter-spacing: -1px; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .lang-pill { background: var(--card); border: 1px solid #eee; border-radius: 20px; padding: 5px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }

        .screen { display: none; padding: 0 20px; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }
        .screen.full-screen { padding: 0; height: calc(100vh - 140px); } /* Для карты */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Карта */
        #mapDisplay { width: 100%; height: 100%; z-index: 1; }

        /* Карточка профиля */
        .user-card {
            background: var(--primary-gradient);
            border-radius: 24px;
            padding: 20px;
            color: white;
            box-shadow: 0 15px 30px rgba(71, 118, 230, 0.2);
            margin-bottom: 20px;
        }
        .user-info { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid white; overflow: hidden; background: #eee; }
        .level-tag { background: rgba(255,255,255,0.2); padding: 3px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 700; }

        .progress-bar { height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; margin: 10px 0; }
        .progress-fill { width: 65%; height: 100%; background: white; border-radius: 3px; }

        /* Лента заданий */
        .req-card {
            background: var(--card);
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 12px;
            display: flex;
            gap: 15px;
            box-shadow: var(--shadow);
            cursor: pointer;
        }
        .req-icon { width: 45px; height: 45px; border-radius: 12px; background: #f0f3ff; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .req-content { flex: 1; }
        .req-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
        .req-meta { font-size: 0.7rem; color: var(--text-sub); }

        /* Модалка */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            display: none;
            align-items: flex-end;
        }
        .modal-content {
            background: white;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            border-radius: 30px 30px 0 0;
            padding: 30px 20px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .btn-main {
            background: var(--primary-gradient);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            font-weight: 700;
            margin-top: 20px;
            cursor: pointer;
        }

        /* Навигация */
        nav {
            position: fixed;
            bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 25px;
            border-top: 1px solid #eee;
            z-index: 1000;
        }
        .nav-link { text-align: center; color: #b2bec3; font-size: 0.65rem; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .nav-link.active { color: var(--primary); }
        .nav-link i { font-size: 1.4rem; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo">Help Hand</div>
        <select class="lang-pill" id="langSwitcher" onchange="updateLang()">
            <option value="ru">🇰🇿 RU</option>
            <option value="kz">🇰🇿 KZ</option>
            <option value="en">🇺🇸 EN</option>
        </select>
    </header>

    <div id="home" class="screen active">
        <div class="user-card">
            <div class="user-info">
                <div class="avatar"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Nurasyl" style="width:100%"></div>
                <div>
                    <h2 id="userName">Нурасыл</h2>
                    <span class="level-tag" id="lvlTag">Герой • LVL 4</span>
                </div>
            </div>
            <div class="progress-bar"><div class="progress-fill"></div></div>
            <div style="display:flex; justify-content:space-between; font-size:0.7rem; opacity:0.8">
                <span>1,240 XP</span>
                <span id="txtNextLvl">До след. уровня 760 XP</span>
            </div>
        </div>

        <h3 id="txtFeed" style="margin-bottom:15px; font-weight:800;">Задания рядом</h3>
        <div id="feedContainer"></div>
    </div>

    <div id="map" class="screen full-screen">
        <div id="mapDisplay"></div>
    </div>

    <div id="profile" class="screen">
        <div style="text-align:center; padding-top:40px;">
            <div class="avatar" style="width:100px; height:100px; margin: 0 auto 20px; border: 4px solid var(--primary);">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Nurasyl" style="width:100%">
            </div>
            <h2 id="profileName">Нурасыл Шарипов</h2>
            <p style="color:var(--text-sub)" id="profileStatus">Талдыкорган, IT School-Lyceum №28</p>
        </div>
    </div>

    <nav>
        <div class="nav-link active" onclick="showScreen('home', this)"><i>🏠</i><span id="navHome">Главная</span></div>
        <div class="nav-link" onclick="showScreen('map', this); initMap();"><i>📍</i><span id="navMap">Карта</span></div>
        <div class="nav-link" onclick="showScreen('profile', this)"><i>👤</i><span id="navProfile">Профиль</span></div>
    </nav>
</div>

<div id="taskModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div style="display:flex; gap:15px; align-items:center; margin-bottom:20px;">
            <div id="modalIcon" class="req-icon">🤝</div>
            <div>
                <h2 id="modalTitle" style="font-size:1.2rem;">Задание</h2>
                <p id="modalDist" style="font-size:0.8rem; color:var(--text-sub)">Расстояние</p>
            </div>
        </div>
        <p id="modalDesc" style="color:var(--text-main); line-height:1.4;">Детальное описание задания появится здесь...</p>
        <button class="btn-main" id="btnAccept" onclick="alert('Вы приняли задание! Удачи!')">Откликнуться</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map;
    const taskData = [
        { id: 1, lat: 45.015, lng: 78.373, cat: "Быт", ru: "Вынести мусор", kz: "Қоқыс шығару", en: "Take out trash", desc: "6 этаж, лифт не работает, нужна помощь пожилому человеку.", icon: "🗑️" },
        { id: 2, lat: 45.018, lng: 78.378, cat: "Здоровье", ru: "Купить лекарства", kz: "Дәрі сатып алу", en: "Buy medicine", desc: "Нужен аспирин и витамины. Аптека в этом же доме.", icon: "💊" },
        { id: 3, lat: 45.012, lng: 78.365, cat: "Транспорт", ru: "Помочь с сумками", kz: "Сөмкеге көмек", en: "Help with bags", desc: "Помочь донести тяжелые сумки от остановки до подъезда.", icon: "🛍️" }
    ];

    const uiLang = {
        ru: { navHome: "Главная", navMap: "Карта", navProfile: "Профиль", txtFeed: "Задания рядом", txtNextLvl: "До след. уровня 760 XP", btnAccept: "Откликнуться" },
        kz: { navHome: "Басты бет", navMap: "Карта", navProfile: "Профиль", txtFeed: "Тапсырмалар", txtNextLvl: "Келесі деңгейге 760 XP", btnAccept: "Көмектесу" },
        en: { navHome: "Home", navMap: "Map", navProfile: "Profile", txtFeed: "Tasks Nearby", txtNextLvl: "760 XP to next level", btnAccept: "Accept Task" }
    };

    function updateLang() {
        const lang = document.getElementById('langSwitcher').value;
        const t = uiLang[lang];
        
        document.getElementById('navHome').innerText = t.navHome;
        document.getElementById('navMap').innerText = t.navMap;
        document.getElementById('navProfile').innerText = t.navProfile;
        document.getElementById('txtFeed').innerText = t.txtFeed;
        document.getElementById('txtNextLvl').innerText = t.txtNextLvl;
        document.getElementById('btnAccept').innerText = t.btnAccept;

        renderFeed(lang);
    }

    function renderFeed(lang) {
        const container = document.getElementById('feedContainer');
        container.innerHTML = taskData.map(task => `
            <div class="req-card" onclick="openTask(${task.id})">
                <div class="req-icon">${task.icon}</div>
                <div class="req-content">
                    <div class="req-title">${task[lang]}</div>
                    <div class="req-meta">${task.cat} • ~300м</div>
                </div>
            </div>
        `).join('');
    }

    function openTask(id) {
        const lang = document.getElementById('langSwitcher').value;
        const task = taskData.find(t => t.id === id);
        document.getElementById('modalTitle').innerText = task[lang];
        document.getElementById('modalDesc').innerText = task.desc;
        document.getElementById('modalIcon').innerText = task.icon;
        document.getElementById('taskModal').style.display = 'flex';
    }

    function closeModal(e) { document.getElementById('taskModal').style.display = 'none'; }

    function showScreen(screenId, navEl) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        navEl.classList.add('active');
    }

    function initMap() {
        if (map) return;
        // Координаты Талдыкоргана
        map = L.map('mapDisplay').setView([45.015, 78.373], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        taskData.forEach(task => {
            const marker = L.marker([task.lat, task.lng]).addTo(map);
            marker.on('click', () => openTask(task.id));
        });
    }

    updateLang();
</script>

</body>
</html>
