<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Help Hand - Multilingual MVP</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #4776E6;
            --primary-gradient: linear-gradient(135deg, #4776E6 0%, #8E54E9 100%);
            --bg: #F8F9FD;
            --card: #FFFFFF;
            --text-main: #2d3436;
            --text-sub: #636e72;
            --shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text-main); }

        /* Auth Screen */
        #authScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary-gradient); z-index: 3000;
            display: flex; flex-direction: column; justify-content: center; padding: 40px; color: white;
        }

        .auth-card { background: white; padding: 30px; border-radius: 24px; color: var(--text-main); }
        .lang-selector { display: flex; gap: 5px; margin-bottom: 20px; justify-content: center; }
        .lang-btn { padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); color: white; cursor: pointer; font-size: 0.7rem; }
        .lang-btn.active { background: white; color: var(--primary); font-weight: 800; }

        .role-selector { display: flex; gap: 10px; margin: 15px 0; }
        .role-btn { flex: 1; padding: 12px; border: 2px solid #eee; border-radius: 12px; cursor: pointer; text-align: center; font-weight: 700; font-size: 0.8rem; }
        .role-btn.active { border-color: var(--primary); background: #f0f3ff; color: var(--primary); }

        /* Main Layout */
        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 90px; display: none; }
        header { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: var(--bg); position: sticky; top: 0; z-index: 1000; }
        
        .screen { display: none; padding: 0 20px; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        input, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 10px; font-family: inherit; }
        .btn-main { background: var(--primary-gradient); color: white; border: none; width: 100%; padding: 15px; border-radius: 15px; font-weight: 700; cursor: pointer; }

        nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; display: flex; justify-content: space-around; padding: 12px 0 25px; border-top: 1px solid #eee; z-index: 1000; }
        .nav-link { text-align: center; color: #b2bec3; font-size: 0.6rem; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .nav-link.active { color: var(--primary); }
        .nav-link i { font-size: 1.3rem; display: block; }

        .req-card { background: var(--card); padding: 16px; border-radius: 20px; margin-bottom: 12px; display: flex; gap: 15px; box-shadow: var(--shadow); }
    </style>
</head>
<body>

<div id="authScreen">
    <div class="lang-selector">
        <div class="lang-btn active" onclick="changeLang('ru', this)">RU</div>
        <div class="lang-btn" onclick="changeLang('kz', this)">KZ</div>
        <div class="lang-btn" onclick="changeLang('en', this)">EN</div>
    </div>
    <h1 style="text-align:center; margin-bottom: 30px; letter-spacing: -1px;" id="authTitle">Help Hand</h1>
    
    <div class="auth-card">
        <label id="lblEnterName" style="font-weight: 800; font-size: 0.8rem;">Как вас зовут?</label>
        <input type="text" id="regName" placeholder="...">
        
        <label id="lblWhoAreYou" style="font-weight: 800; font-size: 0.8rem; margin-top: 10px; display: block;">Кто вы?</label>
        <div class="role-selector">
            <div class="role-btn active" id="btnRoleVol" onclick="setRole('volunteer', this)">Волонтер</div>
            <div class="role-btn" id="btnRoleCre" onclick="setRole('creator', this)">Заказчик</div>
        </div>
        
        <button class="btn-main" id="btnStart" onclick="handleAuth()">Начать</button>
    </div>
</div>

<div class="app-container" id="mainApp">
    <header>
        <div style="font-weight: 900; font-size: 1.2rem; color: var(--primary);">Help Hand</div>
        <div id="userBadge" style="font-size: 0.6rem; font-weight: 800; padding: 4px 10px; background: #e0e7ff; border-radius: 8px;"></div>
    </header>

    <div id="home" class="screen active">
        <h3 style="margin-bottom:15px;" id="txtFeedTitle">Задания рядом</h3>
        <div id="feedContainer"></div>
    </div>

    <div id="create" class="screen">
        <h3 style="margin-bottom:20px;" id="txtCreateTitle">Новая просьба</h3>
        <input type="text" id="taskTitle" placeholder="">
        <textarea id="taskDesc" placeholder=""></textarea>
        <button class="btn-main" id="btnPublish" onclick="createNewTask()">Опубликовать</button>
    </div>

    <div id="profile" class="screen">
        <div class="user-info" style="display:flex; align-items:center; gap:15px; margin-bottom:20px;">
            <div id="profileAvatar" style="width:50px; height:50px; border-radius:50%; background:#eee; overflow:hidden;"></div>
            <div><h2 id="displayProfileName">Name</h2><p id="displayProfileRole" style="font-size:0.7rem; color:var(--text-sub)"></p></div>
        </div>
        <button class="btn-main" style="background: #f1f2f6; color: #2d3436;" onclick="location.reload()" id="btnLogout">Выйти</button>
    </div>

    <nav>
        <div class="nav-link active" onclick="showScreen('home', this)"><i id="iconHome">📋</i><span id="navHome">Лента</span></div>
        <div class="nav-link" id="navCreateBtn" onclick="showScreen('create', this)"><i id="iconCreate">➕</i><span id="navCreate">Создать</span></div>
        <div class="nav-link" onclick="showScreen('profile', this)"><i id="iconProfile">👤</i><span id="navProfile">Профиль</span></div>
    </nav>
</div>

<script>
    let currentLang = 'ru';
    let currentUser = { name: "", role: "volunteer" };
    
    const translations = {
        ru: {
            authTitle: "Help Hand", lblEnterName: "Как вас зовут?", lblWhoAreYou: "Кто вы?", 
            btnRoleVol: "Волонтер", btnRoleCre: "Заказчик", btnStart: "Начать",
            txtFeedTitle: "Задания рядом", txtCreateTitle: "Новая просьба", btnPublish: "Опубликовать",
            navHome: "Лента", navCreate: "Создать", navProfile: "Профиль", btnLogout: "Выйти",
            badgeVol: "ВОЛОНТЕР", badgeCre: "ЗАКАЗЧИК", welcome: "Добро пожаловать", 
            phTitle: "Что нужно сделать?", phDesc: "Детали и адрес...", from: "От"
        },
        kz: {
            authTitle: "Help Hand", lblEnterName: "Есіміңіз кім?", lblWhoAreYou: "Сіз кімсіз?", 
            btnRoleVol: "Волонтер", btnRoleCre: "Тапсырыс беруші", btnStart: "Бастау",
            txtFeedTitle: "Жақын жердегі тапсырмалар", txtCreateTitle: "Жаңа өтініш", btnPublish: "Жариялау",
            navHome: "Таспа", navCreate: "Қосу", navProfile: "Профиль", btnLogout: "Шығу",
            badgeVol: "ВОЛОНТЕР", badgeCre: "ТАПСЫРЫСШЫ", welcome: "Қош келдіңіз",
            phTitle: "Не істеу керек?", phDesc: "Толығырақ және мекен-жайы...", from: "Кімнен"
        },
        en: {
            authTitle: "Help Hand", lblEnterName: "What's your name?", lblWhoAreYou: "Who are you?", 
            btnRoleVol: "Volunteer", btnRoleCre: "Customer", btnStart: "Start",
            txtFeedTitle: "Tasks nearby", txtCreateTitle: "New request", btnPublish: "Post",
            navHome: "Feed", navCreate: "Create", navProfile: "Profile", btnLogout: "Logout",
            badgeVol: "VOLUNTEER", badgeCre: "CUSTOMER", welcome: "Welcome",
            phTitle: "What needs to be done?", phDesc: "Details and address...", from: "From"
        }
    };

    function changeLang(lang, el) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        applyTranslations();
    }

    function applyTranslations() {
        const t = translations[currentLang];
        document.getElementById('lblEnterName').innerText = t.lblEnterName;
        document.getElementById('lblWhoAreYou').innerText = t.lblWhoAreYou;
        document.getElementById('btnRoleVol').innerText = t.btnRoleVol;
        document.getElementById('btnRoleCre').innerText = t.btnRoleCre;
        document.getElementById('btnStart').innerText = t.btnStart;
        document.getElementById('txtFeedTitle').innerText = t.txtFeedTitle;
        document.getElementById('txtCreateTitle').innerText = t.txtCreateTitle;
        document.getElementById('btnPublish').innerText = t.btnPublish;
        document.getElementById('navHome').innerText = t.navHome;
        document.getElementById('navCreate').innerText = t.navCreate;
        document.getElementById('navProfile').innerText = t.navProfile;
        document.getElementById('btnLogout').innerText = t.btnLogout;
        document.getElementById('taskTitle').placeholder = t.phTitle;
        document.getElementById('taskDesc').placeholder = t.phDesc;
        
        if(currentUser.name) {
            document.getElementById('userBadge').innerText = currentUser.role === 'volunteer' ? t.badgeVol : t.badgeCre;
        }
    }

    function setRole(role, el) {
        document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        currentUser.role = role;
    }

    function handleAuth() {
        const name = document.getElementById('regName').value;
        if(!name) return alert(currentLang === 'kz' ? "Есіміңізді жазыңыз" : "Введите имя");
        
        currentUser.name = name;
        document.getElementById('displayProfileName').innerText = name;
        document.getElementById('profileAvatar').innerHTML = `<img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${name}" style="width:100%">`;

        if(currentUser.role === 'volunteer') document.getElementById('navCreateBtn').style.display = 'none';

        applyTranslations();
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        renderFeed();
    }

    let taskData = [{ id: 1, title: "Help with groceries", owner: "Aruzhan" }];

    function renderFeed() {
        const t = translations[currentLang];
        const container = document.getElementById('feedContainer');
        container.innerHTML = taskData.map(task => `
            <div class="req-card">
                <div style="font-size:1.5rem">📦</div>
                <div>
                    <div style="font-weight:800; font-size:0.9rem">${task.title}</div>
                    <div style="font-size:0.7rem; color:var(--text-sub)">${t.from}: ${task.owner}</div>
                </div>
            </div>
        `).reverse().join('');
    }

    function createNewTask() {
        const title = document.getElementById('taskTitle').value;
        if(!title) return;
        taskData.push({ id: Date.now(), title: title, owner: currentUser.name });
        renderFeed();
        showScreen('home', document.querySelector('nav div:first-child'));
    }

    function showScreen(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
    }

    // Инициализация
    applyTranslations();
</script>
</body>
</html>
