<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Help Hand - Final MVP</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #4776E6;
            --primary-gradient: linear-gradient(135deg, #4776E6 0%, #8E54E9 100%);
            --bg: #F8F9FD;
            --card: #FFFFFF;
            --text: #2d3436;
            --shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text); }

        /* Auth */
        #authScreen { position: fixed; inset: 0; background: var(--primary-gradient); z-index: 2000; display: flex; flex-direction: column; justify-content: center; padding: 30px; color: white; }
        .auth-card { background: white; padding: 25px; border-radius: 25px; color: var(--text); }
        .lang-bar { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .l-btn { background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 4px 12px; border-radius: 15px; cursor: pointer; font-size: 0.7rem; }
        .l-btn.active { background: white; color: var(--primary); font-weight: 800; }

        /* Main App */
        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; display: none; padding-bottom: 90px; }
        header { padding: 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg); z-index: 100; }
        
        .screen { display: none; padding: 0 20px; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Task Cards */
        .req-card { background: var(--card); padding: 16px; border-radius: 22px; margin-bottom: 12px; display: flex; gap: 15px; box-shadow: var(--shadow); position: relative; }
        .req-icon { width: 50px; height: 50px; border-radius: 15px; background: #f0f3ff; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
        .dist-badge { font-size: 0.65rem; color: var(--primary); font-weight: 800; display: block; margin-bottom: 2px; }
        .price-badge { background: #e8f5e9; color: #2e7d32; padding: 4px 10px; border-radius: 10px; font-weight: 800; font-size: 0.8rem; margin-top: 5px; display: inline-block; }
        .status-tag { position: absolute; top: 15px; right: 15px; font-size: 0.6rem; font-weight: 800; padding: 3px 8px; border-radius: 8px; }

        /* Form */
        input, textarea { width: 100%; padding: 14px; border-radius: 15px; border: 1px solid #eee; margin-bottom: 12px; font-family: inherit; }
        .btn-main { background: var(--primary-gradient); color: white; border: none; width: 100%; padding: 16px; border-radius: 18px; font-weight: 700; cursor: pointer; }

        /* Nav */
        nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; display: flex; justify-content: space-around; padding: 12px 0 25px; border-top: 1px solid #eee; z-index: 1000; }
        .nav-link { text-align: center; color: #b2bec3; font-size: 0.6rem; font-weight: 700; cursor: pointer; }
        .nav-link.active { color: var(--primary); }
    </style>
</head>
<body>

<div id="authScreen">
    <div class="lang-bar">
        <button class="l-btn active" onclick="setLang('ru', this)">RU</button>
        <button class="l-btn" onclick="setLang('kz', this)">KZ</button>
        <button class="l-btn" onclick="setLang('en', this)">EN</button>
    </div>
    <div class="auth-card">
        <h2 id="t-welcome" style="margin-bottom:15px">Добро пожаловать</h2>
        <input type="text" id="userName" placeholder="Имя / Name">
        <select id="userRole" style="width:100%; padding:14px; border-radius:15px; border:1px solid #eee; margin-bottom:12px;">
            <option value="volunteer" id="opt-vol">Волонтер</option>
            <option value="creator" id="opt-cre">Заказчик</option>
        </select>
        <button class="btn-main" onclick="startApp()" id="t-start">Начать</button>
    </div>
</div>

<div class="app-container" id="mainApp">
    <header>
        <div style="font-weight:900; color:var(--primary)">HELP HAND</div>
        <div id="xpBadge" style="font-size:0.7rem; font-weight:800; background:#f0f3ff; padding:5px 12px; border-radius:10px">LVL 1 • 0 XP</div>
    </header>

    <div id="home" class="screen active">
        <h3 id="t-feed" style="margin-bottom:15px">Задания рядом</h3>
        <div id="feed"></div>
    </div>

    <div id="map" class="screen" style="padding:0; height:75vh;">
        <div id="mapDisplay" style="width:100%; height:100%"></div>
    </div>

    <div id="create" class="screen">
        <h3 id="t-create" style="margin-bottom:15px">Новая просьба</h3>
        <input type="text" id="taskTitle" placeholder="Что нужно сделать?">
        <textarea id="taskDesc" placeholder="Детали..."></textarea>
        <input type="number" id="taskPrice" placeholder="Цена (₸)">
        <button class="btn-main" onclick="addTask()" id="t-post">Опубликовать</button>
    </div>

    <div id="profile" class="screen">
        <h2 id="u-name">User</h2>
        <div style="background:#eee; height:8px; border-radius:4px; margin:15px 0"><div id="xpBar" style="background:var(--primary-gradient); height:100%; width:0%; border-radius:4px; transition:1s"></div></div>
        <button class="btn-main" style="background:#f1f2f6; color:#000; margin-top:20px" onclick="location.reload()">Выход</button>
    </div>

    <nav>
        <div class="nav-link active" onclick="showScreen('home', this)"><i>📋</i><span id="n-feed">Лента</span></div>
        <div class="nav-link" onclick="showScreen('map', this); initMap();"><i>📍</i><span id="n-map">Карта</span></div>
        <div class="nav-link" id="navCreate" onclick="showScreen('create', this)"><i>➕</i><span id="n-add">Создать</span></div>
        <div class="nav-link" onclick="showScreen('profile', this)"><i>👤</i><span id="n-prof">Профиль</span></div>
    </nav>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let curLang = 'ru';
    let user = { name: "", role: "", xp: 0 };
    let tasks = [
        { id: 1, title: "Купить лекарства", owner: "Мария", price: 800, lat: 45.018, lng: 78.375, status: 'open' },
        { id: 2, title: "Помощь с сумками", owner: "Даулет", price: 500, lat: 45.012, lng: 78.368, status: 'open' }
    ];

    const i18n = {
        ru: { welcome: "Добро пожаловать", start: "Начать", feed: "Задания рядом", create: "Новая просьба", post: "Опубликовать", n1: "Лента", n2: "Карта", n3: "Создать", n4: "Профиль", vol: "Волонтер", cre: "Заказчик", dist: "от вас", from: "От" },
        kz: { welcome: "Қош келдіңіз", start: "Бастау", feed: "Тапсырмалар", create: "Жаңа өтініш", post: "Жариялау", n1: "Таспа", n2: "Карта", n3: "Қосу", n4: "Профиль", vol: "Волонтер", cre: "Тапсырысшы", dist: "сізден", from: "Кімнен" },
        en: { welcome: "Welcome", start: "Start", feed: "Nearby Tasks", create: "New Request", post: "Post", n1: "Feed", n2: "Map", n3: "Create", n4: "Profile", vol: "Volunteer", cre: "Customer", dist: "away", from: "From" }
    };

    function setLang(l, btn) {
        curLang = l;
        document.querySelectorAll('.l-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateUI();
    }

    function updateUI() {
        const t = i18n[curLang];
        document.getElementById('t-welcome').innerText = t.welcome;
        document.getElementById('t-start').innerText = t.start;
        document.getElementById('t-feed').innerText = t.feed;
        document.getElementById('t-create').innerText = t.create;
        document.getElementById('t-post').innerText = t.post;
        document.getElementById('n-feed').innerText = t.n1;
        document.getElementById('n-map').innerText = t.n2;
        document.getElementById('n-add').innerText = t.n3;
        document.getElementById('n-prof').innerText = t.n4;
        document.getElementById('opt-vol').innerText = t.vol;
        document.getElementById('opt-cre').innerText = t.cre;
        renderFeed();
    }

    function startApp() {
        user.name = document.getElementById('userName').value || "User";
        user.role = document.getElementById('userRole').value;
        document.getElementById('u-name').innerText = user.name;
        if(user.role === 'volunteer') document.getElementById('navCreate').style.display = 'none';
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        updateUI();
    }

    function renderFeed() {
        const container = document.getElementById('feed');
        const t = i18n[curLang];
        container.innerHTML = tasks.map(task => {
            // Симуляция расстояния: генерим число от 100 до 900 метров
            const fakeDist = Math.floor(Math.random() * 800) + 100;
            return `
                <div class="req-card" onclick="takeTask(${task.id})">
                    <div class="req-icon">🤝</div>
                    <div style="flex:1">
                        <span class="dist-badge">📍 ${fakeDist}m ${t.dist}</span>
                        <div style="font-weight:800; font-size:0.9rem">${task.title}</div>
                        <div style="font-size:0.7rem; color:#666">${t.from}: ${task.owner}</div>
                        <div class="price-badge">${task.price} ₸</div>
                    </div>
                    <span class="status-tag" style="background:${task.status==='open'?'#e3f2fd':'#fff3e0'}">
                        ${task.status === 'open' ? 'OPEN' : 'WORK'}
                    </span>
                </div>
            `;
        }).reverse().join('');
    }

    function addTask() {
        const title = document.getElementById('taskTitle').value;
        const price = document.getElementById('taskPrice').value;
        if(!title || !price) return;
        tasks.push({
            id: Date.now(), title, price, owner: user.name,
            lat: 45.015 + (Math.random()-0.5)*0.02,
            lng: 78.373 + (Math.random()-0.5)*0.02,
            status: 'open'
        });
        showScreen('home', document.querySelector('nav div:first-child'));
        updateUI();
    }

    function takeTask(id) {
        if(user.role !== 'volunteer') return;
        const task = tasks.find(t => t.id === id);
        if(task.status === 'open') {
            task.status = 'taken';
            user.xp += 25;
            document.getElementById('xpBadge').innerText = `LVL 1 • ${user.xp} XP`;
            document.getElementById('xpBar').style.width = user.xp + "%";
            alert("Вы взяли задание! +25 XP");
            renderFeed();
        }
    }

    function showScreen(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
    }

    let map;
    function initMap() {
        if (map) map.remove();
        map = L.map('mapDisplay').setView([45.015, 78.373], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        tasks.forEach(t => L.marker([t.lat, t.lng]).addTo(map).bindPopup(`<b>${t.title}</b><br>${t.price} ₸`));
    }
</script>
</body>
</html>
