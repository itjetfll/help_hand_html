<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Help Hand - Creator & Volunteer Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #4776E6;
            --primary-gradient: linear-gradient(135deg, #4776E6 0%, #8E54E9 100%);
            --success: #00b894;
            --bg: #F8F9FD;
            --card: #FFFFFF;
            --text-main: #2d3436;
            --text-sub: #636e72;
            --shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text-main); }

        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 90px; }

        header {
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            background: var(--bg); position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-weight: 800; font-size: 1.4rem; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .screen { display: none; padding: 0 20px; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Форма создания */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 5px; color: var(--text-sub); }
        input, textarea, select {
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #eee;
            font-family: inherit; font-size: 0.9rem; outline: none;
        }
        textarea { height: 100px; resize: none; }

        /* Модули выбора */
        .module-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .module-opt {
            background: white; padding: 10px; border-radius: 12px; text-align: center;
            border: 2px solid transparent; cursor: pointer; font-size: 0.7rem; font-weight: 700; box-shadow: var(--shadow);
        }
        .module-opt.selected { border-color: var(--primary); background: #f0f3ff; }

        /* Карточки */
        .req-card {
            background: var(--card); padding: 16px; border-radius: 20px; margin-bottom: 12px;
            display: flex; gap: 15px; box-shadow: var(--shadow); position: relative;
        }
        .req-icon { width: 45px; height: 45px; border-radius: 12px; background: #f0f3ff; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .status-badge { position: absolute; top: 15px; right: 15px; font-size: 0.6rem; padding: 3px 8px; border-radius: 8px; font-weight: 800; }
        
        /* Кнопки */
        .btn-main {
            background: var(--primary-gradient); color: white; border: none; width: 100%;
            padding: 15px; border-radius: 15px; font-weight: 700; cursor: pointer; margin-top: 10px;
        }

        nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: white;
            display: flex; justify-content: space-around; padding: 12px 0 25px;
            border-top: 1px solid #eee; z-index: 1000;
        }
        .nav-link { text-align: center; color: #b2bec3; font-size: 0.6rem; font-weight: 700; cursor: pointer; }
        .nav-link.active { color: var(--primary); }
        .nav-link i { font-size: 1.3rem; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="logo">Help Hand</div>
        <div style="font-size: 0.7rem; font-weight: 800; color: var(--success)">ONLINE</div>
    </header>

    <div id="home" class="screen active">
        <h3 style="margin-bottom:15px;">Задания в городе</h3>
        <div id="feedContainer"></div>
    </div>

    <div id="map" class="screen" style="padding:0; height:75vh;">
        <div id="mapDisplay" style="width:100%; height:100%;"></div>
    </div>

    <div id="create" class="screen">
        <h3 style="margin-bottom:20px;">Новая просьба</h3>
        
        <label>Выберите категорию (Модуль)</label>
        <div class="module-grid">
            <div class="module-opt selected" onclick="selectModule('Быт', '🏠', this)">🏠<br>Быт</div>
            <div class="module-opt" onclick="selectModule('Здоровье', '💊', this)">💊<br>Здоровье</div>
            <div class="module-opt" onclick="selectModule('Транспорт', '🚗', this)">🚗<br>Трансп.</div>
        </div>

        <div class="form-group">
            <label>Что нужно сделать?</label>
            <input type="text" id="taskTitle" placeholder="Напр: Купить хлеб">
        </div>

        <div class="form-group">
            <label>Подробности</label>
            <textarea id="taskDesc" placeholder="Опишите детали здесь..."></textarea>
        </div>

        <button class="btn-main" onclick="createNewTask()">Опубликовать на карте</button>
    </div>

    <div id="profile" class="screen">
        <div class="user-info" style="display:flex; align-items:center; gap:15px; margin-bottom:25px;">
            <div style="width:50px; height:50px; border-radius:50%; background:#eee; overflow:hidden;">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Nurasyl" style="width:100%">
            </div>
            <div><h2>Нурасыл</h2><p style="font-size:0.7rem; color:var(--text-sub)">Рейтинг: 5.0 ⭐</p></div>
        </div>
        
        <h4 style="margin-bottom:10px;">Мои заказы</h4>
        <div id="myRequestsContainer"></div>
        
        <h4 style="margin-top:20px; margin-bottom:10px;">Я помогаю</h4>
        <div id="myHelpContainer"></div>
    </div>

    <nav>
        <div class="nav-link active" onclick="showScreen('home', this)"><i>📋</i><span>Лента</span></div>
        <div class="nav-link" onclick="showScreen('map', this); initMap();"><i>📍</i><span>Карта</span></div>
        <div class="nav-link" onclick="showScreen('create', this)"><i>➕</i><span>Создать</span></div>
        <div class="nav-link" onclick="showScreen('profile', this)"><i>👤</i><span>Профиль</span></div>
    </nav>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Исходные данные
    let taskData = [
        { id: 1, lat: 45.015, lng: 78.373, cat: "Быт", title: "Вынести мусор", desc: "6 этаж", icon: "🏠", owner: "System" }
    ];
    let myHelp = []; // Задания, за которые я взялся
    let selectedCat = "Быт";
    let selectedIcon = "🏠";

    function selectModule(cat, icon, el) {
        document.querySelectorAll('.module-opt').forEach(opt => opt.classList.remove('selected'));
        el.classList.add('selected');
        selectedCat = cat;
        selectedIcon = icon;
    }

    function renderFeed() {
        const container = document.getElementById('feedContainer');
        container.innerHTML = taskData.map(task => `
            <div class="req-card" onclick="takeTask(${task.id})">
                <div class="req-icon">${task.icon}</div>
                <div class="req-content">
                    <div class="req-title">${task.title}</div>
                    <div class="req-meta">${task.cat} • Нажмите чтобы помочь</div>
                </div>
            </div>
        `).reverse().join(''); // Новые сверху
    }

    function createNewTask() {
        const title = document.getElementById('taskTitle').value;
        const desc = document.getElementById('taskDesc').value;
        
        if(!title) return alert("Введите название!");

        const newTask = {
            id: Date.now(),
            lat: 45.015 + (Math.random() - 0.5) * 0.01, // Рандомно рядом в Талдыкоргане
            lng: 78.373 + (Math.random() - 0.5) * 0.01,
            cat: selectedCat,
            title: title,
            desc: desc,
            icon: selectedIcon,
            owner: "Me"
        };

        taskData.push(newTask);
        renderFeed();
        renderMyRequests();
        alert("Задание опубликовано!");
        showScreen('home', document.querySelector('nav div:first-child'));
        
        // Очистка формы
        document.getElementById('taskTitle').value = "";
        document.getElementById('taskDesc').value = "";
    }

    function takeTask(id) {
        const task = taskData.find(t => t.id === id);
        if(task.owner === "Me") return alert("Это ваше собственное задание!");
        if(!myHelp.find(t => t.id === id)) {
            myHelp.push(task);
            alert("Вы взялись за помощь!");
            renderMyHelp();
        }
    }

    function renderMyRequests() {
        const container = document.getElementById('myRequestsContainer');
        const mine = taskData.filter(t => t.owner === "Me");
        container.innerHTML = mine.length ? mine.map(t => `
            <div class="req-card" style="border-left: 4px solid var(--primary)">
                <div class="req-icon">${t.icon}</div>
                <div class="req-content">
                    <div class="req-title">${t.title}</div>
                    <div class="req-meta">Ожидает волонтера</div>
                </div>
            </div>
        `).join('') : '<p style="font-size:0.7rem; color:#999;">Вы еще ничего не просили</p>';
    }

    function renderMyHelp() {
        const container = document.getElementById('myHelpContainer');
        container.innerHTML = myHelp.map(t => `
            <div class="req-card" style="border-left: 4px solid var(--success)">
                <div class="req-icon">${t.icon}</div>
                <div class="req-content">
                    <div class="req-title">${t.title}</div>
                    <div class="req-meta">В процессе</div>
                </div>
            </div>
        `).join('') || '<p style="font-size:0.7rem; color:#999;">Пока нет активной помощи</p>';
    }

    function showScreen(id, el) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
    }

    let map;
    function initMap() {
        if (map) map.remove(); 
        map = L.map('mapDisplay').setView([45.015, 78.373], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        taskData.forEach(t => {
            L.marker([t.lat, t.lng]).addTo(map).bindPopup(`<b>${t.title}</b><br>${t.cat}`);
        });
    }

    // Запуск
    renderFeed();
</script>
</body>
</html>
