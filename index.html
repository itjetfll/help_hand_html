<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Help Hand - Pro History</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #4776E6;
            --gradient: linear-gradient(135deg, #4776E6 0%, #8E54E9 100%);
            --bg: #F8F9FD;
            --text: #2d3436;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

        /* Auth */
        #authScreen { position: fixed; inset: 0; background: var(--gradient); z-index: 5000; display: flex; flex-direction: column; justify-content: center; padding: 30px; color: white; }
        .auth-card { background: white; padding: 30px; border-radius: 32px; color: var(--text); }
        .lang-pills { display: flex; gap: 8px; margin-bottom: 25px; justify-content: center; }
        .pill { background: rgba(255,255,255,0.2); border: 1.5px solid white; color: white; padding: 6px 18px; border-radius: 20px; cursor: pointer; font-weight: 800; font-size: 0.75rem; }
        .pill.active { background: white; color: var(--primary); }

        /* Main Shell */
        .app-shell { max-width: 480px; margin: 0 auto; height: 100vh; display: none; flex-direction: column; position: relative; }
        header { padding: 15px 20px; background: white; display: flex; justify-content: space-between; align-items: center; z-index: 10; border-bottom: 1px solid #eee; }
        #map { flex-grow: 1; width: 100%; z-index: 1; }

        /* Feed */
        .task-sheet { position: absolute; bottom: 85px; left: 15px; right: 15px; max-height: 40vh; background: rgba(255,255,255,0.98); backdrop-filter: blur(10px); border-radius: 28px; z-index: 100; padding: 20px; overflow-y: auto; box-shadow: 0 -5px 30px rgba(0,0,0,0.1); }
        .task-card { background: white; padding: 15px; border-radius: 20px; margin-bottom: 10px; border: 1px solid #f1f2f6; display: flex; justify-content: space-between; align-items: center; }

        /* Profile Modal & History */
        .modal { position: fixed; inset: 0; background: white; z-index: 2000; padding: 30px; display: none; flex-direction: column; }
        .modal.active { display: flex; }
        
        .profile-tabs { display: flex; border-bottom: 1px solid #eee; margin-top: 20px; }
        .tab-link { flex: 1; padding: 12px; text-align: center; font-weight: 800; font-size: 0.8rem; color: #b2bec3; cursor: pointer; }
        .tab-link.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
        
        #historyContent { flex-grow: 1; overflow-y: auto; margin-top: 15px; }
        .history-item { background: #f8f9fa; padding: 12px; border-radius: 15px; margin-bottom: 8px; font-size: 0.85rem; border: 1px dashed #ddd; }

        /* Statuses */
        .status-badge { font-size: 0.6rem; font-weight: 800; padding: 4px 8px; border-radius: 8px; text-transform: uppercase; }
        .s-open { background: #e3f2fd; color: #1976d2; }
        .s-proc { background: #fff3e0; color: #e65100; }
        .s-done { background: #e8f5e9; color: #2e7d32; }

        .btn-prime { background: var(--gradient); color: white; border: none; padding: 18px; border-radius: 20px; font-weight: 800; cursor: pointer; width: 100%; }
        nav { height: 75px; background: white; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #eee; }
        .nav-item { text-align: center; color: #b2bec3; cursor: pointer; font-size: 0.65rem; font-weight: 800; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

<div id="authScreen">
    <div class="lang-pills">
        <div class="pill active" onclick="changeLang('ru', this)">RU</div>
        <div class="pill" onclick="changeLang('kz', this)">KZ</div>
        <div class="pill" onclick="changeLang('en', this)">EN</div>
    </div>
    <div class="auth-card">
        <h2 id="t-welcome" style="margin-bottom:15px; color:var(--primary)">Help Hand</h2>
        <input type="text" id="regName" placeholder="Ваше имя">
        <select id="regRole">
            <option value="vol" id="t-vol-opt">Волонтер</option>
            <option value="cre" id="t-cre-opt">Заказчик</option>
        </select>
        <button class="btn-prime" onclick="enterApp()" id="t-enter">Войти</button>
    </div>
</div>

<div class="app-shell" id="app">
    <header>
        <div style="font-weight: 800;" id="uNameDisp">User</div>
        <div id="xpBadge" style="background:var(--gradient); color:white; padding:4px 12px; border-radius:10px; font-size:0.7rem;">LVL 1 • 0 XP</div>
    </header>

    <div id="map"></div>

    <div class="task-sheet" id="homeFeed">
        <h3 id="t-near" style="margin-bottom:15px;">Задания рядом</h3>
        <div id="feed"></div>
    </div>

    <div id="profileModal" class="modal">
        <h2 id="p-user-name">User</h2>
        <div style="background: #f1f2f6; padding: 15px; border-radius: 20px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center;">
            <span id="t-stats">Выполнено:</span>
            <strong id="p-helped" style="color: var(--primary)">0</strong>
        </div>

        <div class="profile-tabs">
            <div class="tab-link active" onclick="switchTab('proc', this)" id="t-tab-proc">В процессе</div>
            <div class="tab-link" onclick="switchTab('done', this)" id="t-tab-hist">История</div>
        </div>

        <div id="historyContent">
            </div>

        <button class="btn-prime" onclick="closeProfile()" id="t-back" style="margin-top: 15px;">К карте</button>
    </div>

    <div id="createModal" class="modal">
        <h2 id="t-new">Новое задание</h2>
        <input type="text" id="taskTitle" placeholder="Что сделать?">
        <input type="number" id="taskPrice" placeholder="Цена (₸)">
        <button class="btn-prime" onclick="confirmTask()" id="t-pub">Опубликовать</button>
        <button onclick="closeModal()" style="background:none; border:none; margin-top:15px; color:#999;">Отмена</button>
    </div>

    <nav>
        <div class="nav-item active" onclick="tab('home', this)"><span>📍</span><p id="n-map">Карта</p></div>
        <div class="nav-item" id="navAdd" onclick="showCreate()"><span>➕</span><p id="n-add">Создать</p></div>
        <div class="nav-item" onclick="showProfile()"><span>👤</span><p id="n-prof">Профиль</p></div>
    </nav>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let curLang = 'ru';
    let user = { name: "", role: "", xp: 0, helped: 0 };
    let tasks = [
        { id: 1, title: "Помочь бабушке с пакетами", price: 500, status: "open", dist: "300м" },
        { id: 2, title: "Выгулять собаку", price: 1200, status: "open", dist: "800м" }
    ];
    let currentTab = 'proc';

    const i18n = {
        ru: { near: "Задания рядом", n_map: "Карта", n_add: "Создать", n_prof: "Профиль", enter: "Войти", vol: "Волонтер", cre: "Заказчик", pub: "Опубликовать", new: "Новое задание", back: "Назад", open: "Открыто", proc: "В процессе", hist: "История", take: "Помочь", finish: "Завершить", empty: "Здесь пока пусто" },
        kz: { near: "Тапсырмалар", n_map: "Карта", n_add: "Қосу", n_prof: "Профиль", enter: "Кіру", vol: "Волонтер", cre: "Тапсырысшы", pub: "Жариялау", new: "Жаңа өтініш", back: "Артқа", open: "Ашық", proc: "Орындалуда", hist: "Тарихы", take: "Көмектесу", finish: "Аяқтау", empty: "Әзірге бос" },
        en: { near: "Nearby Tasks", n_map: "Map", n_add: "Create", n_prof: "Profile", enter: "Enter", vol: "Volunteer", cre: "Customer", pub: "Publish", new: "New Task", back: "Back", open: "Open", proc: "In Progress", hist: "History", take: "Help", finish: "Finish", empty: "Nothing here yet" }
    };

    function changeLang(l, btn) {
        curLang = l;
        document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        updateTexts();
    }

    function updateTexts() {
        const t = i18n[curLang];
        document.getElementById('t-near').innerText = t.near;
        document.getElementById('n-map').innerText = t.n_map;
        document.getElementById('n-add').innerText = t.n_add;
        document.getElementById('n-prof').innerText = t.n_prof;
        document.getElementById('t-enter').innerText = t.enter;
        document.getElementById('t-vol-opt').innerText = t.vol;
        document.getElementById('t-cre-opt').innerText = t.cre;
        document.getElementById('t-pub').innerText = t.pub;
        document.getElementById('t-new').innerText = t.new;
        document.getElementById('t-back').innerText = t.back;
        document.getElementById('t-tab-proc').innerText = t.proc;
        document.getElementById('t-tab-hist').innerText = t.hist;
        renderFeed();
        renderHistory();
    }

    function enterApp() {
        user.name = document.getElementById('regName').value || "User";
        user.role = document.getElementById('regRole').value;
        document.getElementById('uNameDisp').innerText = user.name;
        document.getElementById('p-user-name').innerText = user.name;
        if(user.role === 'vol') document.getElementById('navAdd').style.display = 'none';
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        initMap();
        updateTexts();
    }

    function renderFeed() {
        const feed = document.getElementById('feed');
        const t = i18n[curLang];
        feed.innerHTML = tasks.filter(x => x.status === 'open').map(task => `
            <div class="task-card">
                <div>
                    <span class="status-badge s-open">${t.open}</span>
                    <h4 style="margin:5px 0">${task.title}</h4>
                    ${user.role === 'vol' ? `<button onclick="takeTask(${task.id})" style="background:var(--gradient); color:white; border:none; padding:6px 12px; border-radius:10px; font-weight:800; font-size:0.7rem">${t.take}</button>` : ''}
                </div>
                <div style="font-weight:800; color:#2ecc71">${task.price} ₸</div>
            </div>
        `).join('');
    }

    function takeTask(id) {
        const task = tasks.find(x => x.id === id);
        task.status = 'processing';
        renderFeed();
        renderHistory();
        alert(curLang === 'kz' ? "Қабылданды! Профильді тексеріңіз." : "Принято! Проверьте профиль.");
    }

    function renderHistory() {
        const container = document.getElementById('historyContent');
        const t = i18n[curLang];
        const filtered = tasks.filter(x => x.status === (currentTab === 'proc' ? 'processing' : 'done'));

        if(filtered.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:#999; margin-top:20px;">${t.empty}</p>`;
            return;
        }

        container.innerHTML = filtered.map(task => `
            <div class="history-item">
                <div style="display:flex; justify-content:space-between">
                    <b>${task.title}</b>
                    <span>${task.price} ₸</span>
                </div>
                ${task.status === 'processing' ? `<button onclick="finishTask(${task.id})" style="margin-top:10px; background:#2ecc71; color:white; border:none; padding:5px 10px; border-radius:8px; font-size:0.7rem; font-weight:800;">${t.finish}</button>` : `<span class="status-badge s-done" style="margin-top:5px; display:inline-block">${t.done}</span>`}
            </div>
        `).join('');
    }

    function finishTask(id) {
        const task = tasks.find(x => x.id === id);
        task.status = 'done';
        user.helped++;
        user.xp += 50;
        document.getElementById('p-helped').innerText = user.helped;
        document.getElementById('xpBadge').innerText = `LVL 1 • ${user.xp} XP`;
        renderHistory();
    }

    function switchTab(type, el) {
        currentTab = type;
        document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active'));
        el.classList.add('active');
        renderHistory();
    }

    function showProfile() { document.getElementById('profileModal').classList.add('active'); renderHistory(); }
    function closeProfile() { document.getElementById('profileModal').classList.remove('active'); }
    function showCreate() { document.getElementById('createModal').classList.add('active'); }
    function closeModal() { document.getElementById('createModal').classList.remove('active'); }

    function confirmTask() {
        const title = document.getElementById('taskTitle').value;
        const price = document.getElementById('taskPrice').value;
        if(!title || !price) return;
        tasks.push({ id: Date.now(), title, price, status: "open" });
        closeModal();
        renderFeed();
    }

    function initMap() {
        let map = L.map('map', { zoomControl: false }).setView([45.015, 78.373], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    }
</script>
</body>
</html>
